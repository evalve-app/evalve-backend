name: Publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - name: Show the pinned reference
        run: |
          echo "Pin this in evalve-deploy:" >> "$GITHUB_STEP_SUMMARY"
          echo '`ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
