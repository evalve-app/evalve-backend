[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "evalve-mcp"
version = "0.1.1"
description = "Local MCP server through which a coding agent runs Evalve Loops"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.22,<2",
]

[project.scripts]
evalve-mcp = "evalve_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evalve_mcp"]
